name: CI

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch: { }

# Only the latest run per PR stays alive — force-pushes cancel stale runs
# instead of burning runner minutes on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CRYSTAL_VERSION: 1.21.0

jobs:
  test-build:
    name: Test build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}

      - name: Install GTK3 (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Install shards
        working-directory: ./jb_updater
        run: shards install

      - name: Run Ameba linter
        working-directory: ./jb_updater
        run: ./bin/lint

      - name: Check formatting
        working-directory: ./jb_updater
        run: crystal tool format --check src/ spec/

      - name: Run specs
        working-directory: ./jb_updater
        run: crystal spec -v

      - name: Run Catalyst static perf analysis
        working-directory: ./jb_updater
        shell: bash
        run: |
          crystal build lib/catalyst/src/catalyst.cr -o "${RUNNER_TEMP}/catalyst"
          "${RUNNER_TEMP}/catalyst" --baseline .catalyst-baseline.json --ci src/ || "${RUNNER_TEMP}/catalyst" --ci src/

      - name: Build CLI
        working-directory: ./jb_updater
        run: crystal build src/main.cr --release -o jb_updater

      - name: Build GUI
        working-directory: ./jb_updater
        run: crystal build src/gui/main_gui.cr --release -Dpreview_mt -o jb_updater_gui

      - name: Run CLI --help
        working-directory: ./jb_updater
        run: ./jb_updater --help

  userscript-test:
    name: Tampermonkey userscript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check userscript syntax
        working-directory: ./tampermonkey
        run: node --check redirect_on_451.user.js

      - name: Run userscript tests
        working-directory: ./tampermonkey
        run: node --test redirect_on_451.test.mjs
