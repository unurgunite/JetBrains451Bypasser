name: Release

# One button, one input: type the version, get tag + GitHub Release.
# Pushing a v*.*.* tag by hand still works and does the same thing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, without the leading v (e.g. 1.2.0)'
        required: true
        type: string
  push:
    tags: [ "v*.*.*" ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CRYSTAL_VERSION: 1.21.0
  # Manual runs take the input, tag pushes take the tag name.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  # Fail fast, before seven runner-minutes of compilation.
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version is semver without a leading v
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.0, got: '$VERSION'" >&2
            exit 1
          fi

      - name: Version matches source and shard.yml
        run: |
          SRC_VERSION=$(grep -oE 'VERSION *= *"[^"]+"' jb_updater/src/jb_updater.cr | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          SHARD_VERSION=$(grep -E '^version:' jb_updater/shard.yml | cut -d: -f2 | tr -d ' ')
          echo "input=$VERSION src=$SRC_VERSION shard.yml=$SHARD_VERSION"
          if [[ "$SRC_VERSION" != "$VERSION" ]]; then
            echo "jb_updater/src/jb_updater.cr VERSION is $SRC_VERSION, release says $VERSION" >&2
            exit 1
          fi
          if [[ "$SHARD_VERSION" != "$VERSION" ]]; then
            echo "jb_updater/shard.yml version is $SHARD_VERSION, release says $VERSION" >&2
            exit 1
          fi

      - name: Tag does not exist yet
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists on origin" >&2
            exit 1
          fi

  linux:
    name: Linux x86_64
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libssl-dev libpcre2-dev libgc-dev liblzma-dev libgtk-3-dev
      - name: Install shards
        working-directory: jb_updater
        run: shards install
      - name: Run Ameba linter
        working-directory: jb_updater
        run: ./bin/lint
      - name: Run specs
        working-directory: jb_updater
        run: crystal spec -v
      - name: Build binaries (CLI + GUI)
        working-directory: jb_updater
        run: |
          crystal build src/main.cr --release --no-debug -o jb_updater
          crystal build src/gui/main_gui.cr --release -Dpreview_mt --no-debug -o jb_updater_gui
      - name: Smoke test — CLI binary loads
        working-directory: jb_updater
        run: ./jb_updater --help
      - name: Package artifacts
        run: |
          tar -czf jb_updater-cli-linux-x86_64.tar.gz -C jb_updater jb_updater
          tar -czf jb_updater-gui-linux-x86_64.tar.gz -C jb_updater jb_updater_gui
          mkdir -p jb_updater-bundle
          cp jb_updater/jb_updater     jb_updater-bundle/
          cp jb_updater/jb_updater_gui jb_updater-bundle/
          cp jb_updater/assets/jb_updater.svg jb_updater-bundle/
          tar -czf jb_updater-bundle-linux-x86_64.tar.gz -C jb_updater-bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: jb_updater-cli-linux-x86_64
          path: jb_updater-cli-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: jb_updater-gui-linux-x86_64
          path: jb_updater-gui-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: jb_updater-bundle-linux-x86_64
          path: jb_updater-bundle-linux-x86_64.tar.gz

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    strategy:
      matrix:
        include:
          - arch: arm64
            runs_on: macos-latest
          - arch: x86_64
            runs_on: macos-15-intel
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}
      - name: Install OpenSSL 3
        run: brew install openssl@3
      - name: Install shards
        working-directory: jb_updater
        run: shards install
      - name: Run Ameba linter
        working-directory: jb_updater
        run: ./bin/lint
      - name: Run specs
        working-directory: jb_updater
        run: crystal spec -v
      - name: Build binaries (CLI + GUI)
        working-directory: jb_updater
        run: |
          brew_prefix=$(brew --prefix openssl@3)
          unset PKG_CONFIG_PATH
          export PKG_CONFIG_PATH="${brew_prefix}/lib/pkgconfig"
          echo "Using OpenSSL from ${brew_prefix}"

          crystal build src/main.cr --release --no-debug \
            --link-flags "-L${brew_prefix}/lib -I${brew_prefix}/include" \
            -o jb_updater
          crystal build src/gui/main_gui.cr --release -Dpreview_mt --no-debug \
            --link-flags "-L${brew_prefix}/lib -I${brew_prefix}/include" \
            -o jb_updater_gui

      - name: Bundle OpenSSL runtime dylibs
        working-directory: jb_updater
        run: |
          brew_prefix=$(brew --prefix openssl@3)
          for dylib in libcrypto.3.dylib libssl.3.dylib; do
            cp "$brew_prefix/lib/$dylib" .
            install_name_tool -id "@loader_path/$dylib" "$dylib"
            for dep in $(otool -L "$dylib" | grep "/opt/homebrew\|/usr/local" | awk '{print $1}'); do
              install_name_tool -change "$dep" "@loader_path/$(basename $dep)" "$dylib"
            done
          done
          for exe in jb_updater jb_updater_gui; do
            for dep in $(otool -L "$exe" | grep "/opt/homebrew\|/usr/local" | awk '{print $1}'); do
              install_name_tool -change "$dep" "@loader_path/$(basename $dep)" "$exe"
            done
          done

      - name: Smoke test — CLI binary loads
        working-directory: jb_updater
        run: ./jb_updater --help
      - name: Package artifacts
        working-directory: jb_updater
        run: |
          tar -czf "../jb_updater-cli-macos-${ARCH}.tar.gz" jb_updater
          tar -czf "../jb_updater-gui-macos-${ARCH}.tar.gz" jb_updater_gui
          mkdir -p ../jb_updater-bundle
          cp jb_updater jb_updater_gui libcrypto.3.dylib libssl.3.dylib assets/jb_updater.svg ../jb_updater-bundle/
          tar -czf "../jb_updater-bundle-macos-${ARCH}.tar.gz" -C ../jb_updater-bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: jb_updater-cli-macos-${{ matrix.arch }}
          path: jb_updater-cli-macos-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: jb_updater-gui-macos-${{ matrix.arch }}
          path: jb_updater-gui-macos-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: jb_updater-bundle-macos-${{ matrix.arch }}
          path: jb_updater-bundle-macos-${{ matrix.arch }}.tar.gz

  windows:
    name: Windows x86_64
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}
      - name: Install shards
        working-directory: jb_updater
        run: shards install
      - name: Run Ameba linter
        working-directory: jb_updater
        run: ./bin/lint
      - name: Run specs
        working-directory: jb_updater
        run: crystal spec -v
      - name: Build binaries (CLI + GUI)
        working-directory: jb_updater
        run: |
          crystal build src/main.cr --release --no-debug -o jb_updater.exe
          crystal build src/gui/main_gui.cr --release -Dpreview_mt --no-debug --link-flags=/SUBSYSTEM:WINDOWS -o jb_updater_gui.exe
      - name: Smoke test — CLI binary loads
        working-directory: jb_updater
        shell: cmd
        run: |
          rem Verify the CLI binary starts (proves all DLLs resolve correctly).
          rem 0xC0000135 would kill the process before any output.
          .\jb_updater.exe --help

      - name: Verify GUI DLLs are present
        working-directory: jb_updater
        shell: pwsh
        run: |
          # Can't run the GUI binary on headless CI (no display), but we can
          # confirm all DLLs exist alongside the GUI EXE.
          $exe = "jb_updater_gui.exe"
          $dlls = @(Get-ChildItem *.dll)
          if (-not (Test-Path $exe)) {
            Write-Host "::error::$exe not found"
            exit 1
          }
          Write-Host "$exe found, $($dlls.Count) DLLs present:"
          $dlls | ForEach-Object { Write-Host "  → $($_.Name) ($( '{0:N0}' -f $_.Length ) bytes)" }

      - name: Package artifacts
        run: |
          Compress-Archive -Path jb_updater\jb_updater.exe, jb_updater\*.dll -DestinationPath jb_updater-cli-windows-x86_64.zip
          Compress-Archive -Path jb_updater\jb_updater_gui.exe, jb_updater\*.dll -DestinationPath jb_updater-gui-windows-x86_64.zip
          New-Item -ItemType Directory -Force -Path jb_updater-bundle | Out-Null
          Copy-Item jb_updater\*.exe, jb_updater\*.dll jb_updater-bundle\
          Compress-Archive -Path jb_updater-bundle\* -DestinationPath jb_updater-bundle-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jb_updater-cli-windows-x86_64
          path: jb_updater-cli-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jb_updater-gui-windows-x86_64
          path: jb_updater-gui-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jb_updater-bundle-windows-x86_64
          path: jb_updater-bundle-windows-x86_64.zip

  release:
    name: Tag + GitHub Release
    needs: [ linux, macos, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Manual runs need the tag created here; tag pushes already have it.
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find ./all-artifacts -type f -exec mv {} ./release-assets/ \;

      - name: Add Tampermonkey userscript
        run: |
          cp tampermonkey/redirect_on_451.user.js release-assets/
          node --check release-assets/redirect_on_451.user.js

      - name: Generate checksums
        run: |
          cd release-assets
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --verify-tag \
            release-assets/*
